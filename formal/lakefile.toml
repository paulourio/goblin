name = "GoblinFormal"
version = "0.1.0"
lintDriver = "batteries/runLinter"
defaultTargets = [
  "GoblinFormal",
  "lsap-check",
  "rules-check",
  "cuts-check",
  "lp-check",
  "vipr-check",
  "bin-check",
  "simd-cfg-check",
]

[leanOptions]
linter.extra = true
linter.redundantVisibility = true

[[require]]
name = "batteries"
git = "https://github.com/leanprover-community/batteries"
rev = "v4.36.0"

[[lean_lib]]
name = "GoblinFormal"

[[lean_lib]]
name = "Apps"
roots = ["Apps.Common"]

[[lean_exe]]
name = "lsap-check"
root = "Apps.LsapCheck"

[[lean_exe]]
name = "rules-check"
root = "Apps.RulesCheck"

[[lean_exe]]
name = "cuts-check"
root = "Apps.CutsCheck"

[[lean_exe]]
name = "lp-check"
root = "Apps.LpCheck"

[[lean_exe]]
name = "vipr-check"
root = "Apps.ViprCheck"

[[lean_exe]]
name = "bin-check"
root = "Apps.BinCheck"

[[lean_exe]]
name = "simd-cfg-check"
root = "Apps.SimdCfgCheck"
